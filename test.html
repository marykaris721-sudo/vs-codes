<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎉 Happy Birthday!</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- 🎈 Floating Balloons Background -->
  <div class="balloons">
    <span>🎈</span><span>🎈</span><span>🎈</span>
    <span>🎈</span><span>🎈</span><span>🎈</span>
  </div>

  <!-- 🎉 Confetti Canvas -->
  <canvas id="confetti"></canvas>

  <!-- 💝 Main Card -->
  <main class="card">
    <div class="cake">🎂</div>
    <h1 class="title">Happy Birthday!</h1>
    <h2 class="name">Dear <span id="personName">Bestie</span>,</h2>
    <p class="message">
      May your day be filled with joy, laughter, and lots of cake! 🍰<br />
      You deserve all the happiness in the world. 💖
    </p>

    <div class="buttons">
      <button id="confettiBtn">🎊 Celebrate</button>
      <button id="musicBtn">🎵 Play Music</button>
      <button id="surpriseBtn">🎁 Surprise</button>
    </div>

    <!-- 🖼️ Photo Gallery -->
    <section class="gallery">
      <h3>Our Memories</h3>
      <div class="photos">
        <img src="images/photo1.jpg" alt="Memory 1" />
        <img src="images/photo2.jpg" alt="Memory 2" />
        <img src="images/photo3.jpg" alt="Memory 3" />
      </div>
    </section>

    <!-- 💌 Wishes Wall -->
    <section class="wishes">
      <h3>Leave a Wish 💝</h3>
      <div class="wish-input">
        <input type="text" id="wishInput" placeholder="Write your wish..." />
        <button id="addWish">Add</button>
      </div>
      <ul id="wishList"></ul>
    </section>
  </main>

  <!-- 🎁 Surprise Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h2>🎉 Surprise! 🎉</h2>
      <p>You are the best! Here's a virtual hug 🤗 and lots of love 💕</p>
      <div class="emoji-burst">🎊 🎉 🎁 🎂 🎈</div>
    </div>
  </div>

  <!-- 🎵 Audio -->
  <audio id="bgMusic" loop>
    <source src="music/birthday.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
